<!DOCTYPE html>
<!--
  ═══════════ คู่มือไฟล์ HaDoo Shop (ไฟล์เดียวจบ) ═══════════
  ไฟล์นี้มี 3 ส่วน:
   1) <style>  = หน้าตา/สี/ฟอนต์ (CSS)
   2) <body>   = โครงหน้า (แถบเมนู + ช่องว่าง #app ที่โค้ดจะมาเติมเนื้อหา)
   3) <script> = ระบบทั้งหมด (JavaScript) แบ่งเป็นหัวข้อ 1) ถึง 9)
  จะแก้อะไร:
   • สี            -> ใน <style> ตัวแปร --c0 ถึง --c4 (สีฤดู) และ --acc (สีปุ่มหลัก)
   • ชื่อตัวละคร   -> script หัวข้อ 1) บรรทัด DEFCH
   • ข้อความ/รูป/ราคา/QR -> ไม่ต้องแก้โค้ด ใช้หน้า Owner login ท้ายเว็บ
   • <script id="seed"> = ข้อมูลที่ฝังมากับไฟล์ตอน Export (ไม่ต้องแก้มือ)
  ═══════════════════════════════════════════════════════════
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HADOO: 5 Seasons Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fffaf5;
  --card:#fff;
  --ink:#3b3350;
  --mute:#7a7090;
  --line:#eadff3;
  --c0:#ffc8dd;
  --c1:#ffe29a;
  --c2:#b9dcff;
  --c3:#ffc9a0;
  --c4:#d5c6ff;
  --acc:#ff7eb6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg:#1d1928;
    --card:#2a2439;
    --ink:#f3eefc;
    --mute:#b4a9cc;
    --line:#413858}
}
:root[data-theme="dark"] {
  --bg:#1d1928;
  --card:#2a2439;
  --ink:#f3eefc;
  --mute:#b4a9cc;
  --line:#413858}
html {
  scroll-padding-top:env(safe-area-inset-top,0px)}
* {
  box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;
  line-height:1.5}
.wrap {
  max-width:1080px;
  margin:auto;
  padding:0 16px}
nav {
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:5;
  background:var(--card);
  border-bottom:2px solid var(--line)}
nav .wrap {
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  padding-top:8px;
  padding-bottom:8px}
.logo {
  font-weight:700;
  font-size:26px;
  cursor:pointer;
  margin-right:auto;
  display:flex;
  align-items:center;
  gap:8px}
.logo img {
  height:36px}
.logo b {
  background:linear-gradient(90deg,#ff7eb6,#ffb347,#5fb3ff,#a98bff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent}
.btn {
  border:0;
  border-radius:99px;
  padding:9px 18px;
  font:600 15px Fredoka,sans-serif;
  background:var(--c4);
  color:#3b3350;
  cursor:pointer}
.btn.p {
  background:var(--acc);
  color:#fff}
.btn.s {
  padding:5px 12px;
  font-size:13px}
.btn.d {
  background:#ff9aa2;
  color:#fff}
.btn[disabled] {
  opacity:.45;
  cursor:not-allowed}
.btn.on {
  outline:3px solid var(--acc)}
.hero {
  padding:36px 16px;
  text-align:center;
  background:linear-gradient(135deg,var(--c0),var(--c1),var(--c2),var(--c4));
  color:#3b3350;
  border-radius:0 0 40px 40px}
.hero h1 {
  font-size:clamp(30px,6vw,52px);
  margin:8px 0}
.hero p {
  max-width:620px;
  margin:8px auto 18px}
.faces {
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:16px 0}
.faces img {
  width:84px;
  height:84px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #fff;
  background:#fff}
h2 {
  font-size:28px;
  margin:34px 0 14px}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:16px}
.card {
  background:var(--card);
  border:2px solid var(--line);
  border-radius:24px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:6px}
.card img.m {
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:18px;
  background:var(--line)}
.tag {
  display:inline-block;
  border-radius:99px;
  padding:2px 10px;
  font-size:12px;
  font-weight:600;
  background:#fff8;
  color:#3b3350;
  width:fit-content}
.mute {
  color:var(--mute);
  font-size:14px}
.price {
  font-weight:700;
  font-size:18px}
.two {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px}
@media(max-width:700px) {
  .two {
    grid-template-columns:1fr}
}
.thumbs {
  display:flex;
  gap:8px;
  margin-top:8px;
  flex-wrap:wrap}
.thumbs img {
  width:64px;
  height:64px;
  object-fit:cover;
  border-radius:12px;
  cursor:pointer;
  border:3px solid transparent}
.thumbs img.on {
  border-color:var(--acc)}
input,textarea,select {
  width:100%;
  padding:9px 12px;
  border-radius:14px;
  border:2px solid var(--line);
  background:var(--card);
  color:var(--ink);
  font:inherit}
label {
  display:block;
  font-size:13px;
  font-weight:600;
  margin:8px 0 2px}
textarea {
  min-height:70px}
.q {
  width:70px;
  display:inline-block}
.row {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center}
.box {
  background:var(--card);
  border:2px solid var(--line);
  border-radius:24px;
  padding:16px;
  margin-bottom:14px}
.note {
  background:var(--c1);
  color:#3b3350;
  border-radius:16px;
  padding:10px 14px;
  margin:10px 0;
  font-size:14px}
table {
  width:100%;
  border-collapse:collapse;
  font-size:14px}
td,th {
  padding:6px;
  border-bottom:1px solid var(--line);
  text-align:left;
  vertical-align:top}
.tw {
  overflow-x:auto}
footer {
  margin-top:40px;
  background:var(--card);
  border-top:2px solid var(--line);
  padding:24px 0;
  text-align:center}
.pv {
  display:inline-block;
  margin:4px}
.pv img {
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:12px;
  display:block}
.qr {
  width:220px;
  max-width:100%;
  border-radius:16px;
  background:#fff;
  display:block;
  margin:8px auto}
.grp {
  width:100%;
  max-width:640px;
  aspect-ratio:16/9;
  object-fit:contain;
  border-radius:24px;
  margin:10px auto;
  display:block;
  background:#fff}
ul {
  padding-left:20px;
  margin:6px 0}
</style></head><body>
<nav><div class="wrap"><div class="logo" onclick="go('home')" id="logo"></div><span id="menu"></span></div></nav>
<div id="app"></div>
<script id="seed" type="application/json">null</script>
<script>
const COL = ['#d4f0c0', '#ffe680', '#ffc98a', '#bfe6f5', '#e4ddf5']; // Spring, Summer, Autumn, Rainy, Winter accents
const accent = i => COL[i];
const VIEWS = ['Main illustration', 'Front view', 'Side view', 'Back view', 'Close-up details', 'Character sketch', 'Concept art', 'Product photo', 'Packaging photo'];
const DEFINTRO = 'Meet the Hadoos, a team of seasonal aliens bringing their own personality and adventures to Earth.';
const DEFSTORY = 'Five aliens from the Moon are sent to Earth to create and look after its seasons. Each Hadoo has its own personality, appearance, and message. Every season has its own beauty, personality, and way to enjoy life.';
const DEFCH = [
    { name: 'Hadoo Spring', season: 'Spring', personality: 'Curious, Gentle, Cheerful, Nature-loving, Optimistic', story: "Hadoo Spring is one of the five aliens sent from the Moon to Earth to look after the changing seasons. When it arrives during spring, it discovers flowers blooming and fresh green leaves growing everywhere. Fascinated by the beauty of nature, Hadoo Spring begins exploring the world and collecting little treasures. Through its discoveries, it celebrates new beginnings, growth, and the joy of finding something beautiful in everyday life.", message: "Every day is a new beginning." },
    { name: 'Hadoo Summer', season: 'Summer', storyTitle: 'The Summer Guardian', tagline: 'A Little Sunshine, A Lot of Mischief.', personality: 'Playful, Energetic, Fun-loving, Free-spirited, Mischievous, Adventurous', story: "Hadoo Summer is one of the aliens responsible for creating and looking after the seasons on Earth. As the guardian of summer, it travels from the Moon to Earth to inspect its season and make sure everything is going well. However, Hadoo Summer loves playing, exploring, and enjoying sunny days so much that it often turns its work into an adventure. Through its playful and energetic spirit, it reminds people to enjoy the moment, feel free, and embrace their energy.\n\nHadoo Summer is so mischievous that it accidentally breaks one of its horns while playing. It continues its summer duties with the remaining horn, which still shows visible marks from the break.", message: "Enjoy the moment, feel free, and embrace your energy.", design: "Bright yellow body representing sunshine and summer energy\nDistinctive crescent-moon eyes\nOne remaining horn with visible break marks\nBlue overalls\nA tropical-patterned swimming ring\nA colorful beaded necklace with a sun pendant\nA playful, energetic appearance" },
    { name: 'Hadoo Autumn', season: 'Autumn', personality: 'Curious, Observant, Inquisitive, Thoughtful, Fascinated by change', story: "Hadoo Autumn is one of the five aliens responsible for looking after the seasons on Earth. During its visit to Earth, it notices that the leaves are changing from green to shades of yellow, orange, and red before falling from the trees. Curious about this unusual transformation, Hadoo Autumn begins collecting fallen leaves as evidence to report back to the Moon. Its journey helps celebrate the beauty of change and the idea that every ending can be part of a new beginning.", message: "Change can be beautiful." },
    { name: 'Hadoo Rainy', season: 'Rainy Season', personality: 'Shy, Gentle, Calm, Observant, Appreciative of little things', story: "Hadoo Rainy is one of the five aliens assigned to look after the seasons on Earth. When it arrives during the rainy season, it discovers raindrops, puddles, and skies filled with clouds. While exploring the world, it becomes fascinated by the small details that people often overlook, such as the sound of rain and the reflections in puddles. Through these discoveries, Hadoo Rainy reminds people that even quiet and ordinary moments can hold their own kind of beauty.", message: "Find beauty in the little moments." },
    { name: 'Hadoo Winter', season: 'Winter', personality: 'Determined, Hardworking, Caring, Warm-hearted', traitNote: "Hadoo Winter may feel surprised by the harsh cold at first, but it is brave enough to keep exploring and learning from new experiences.", story: "Hadoo Winter was sent from the Moon to observe how Earth changes during winter. At first, it was shocked by how harsh and cold the weather could be. While exploring Earth, Hadoo discovered people gathering to celebrate Christmas and wearing warm clothes. Inspired by them, Hadoo began wearing warm clothing to protect itself from the cold. Now, Hadoo Winter is ready to face the coldest journeys, learning that warmth can also come from the people around us.", message: "Even in the coldest moments, warmth can be found in the people around you.", design: "Represents determination, effort, and heart-warming kindness\nIts winter outfit reflects its journey to adapt to Earth’s cold weather", cta: "That’s cool! Take my Hadoo’s hand, and let’s go on our next journey!" }
]; // All five characters now use the official text supplied by the HADOO team.
const $ = s => document.querySelector(s), esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ═══════════════════════════════════════════
   2) ข้อมูลของร้าน (D) และสถานะหน้าเว็บ (S)
   ═══════════════════════════════════════════ */
// ld = อ่านข้อมูลจาก localStorage (ที่เก็บของเบราว์เซอร์)
const ld = (k, d) => { try {
    return JSON.parse(localStorage.getItem(k)) || d;
}
catch (e) {
    return d;
} };
let D = { ts: 0, site: {}, chars: [], products: [], codes: [], pay: {}, gallery: [], pin: '' };
// ข้อมูลร้านเก็บใน IndexedDB (ใหญ่กว่า localStorage มาก) | ข้อมูลที่ฝังมากับไฟล์ตอน Export อยู่ใน #seed
let SEED = null;
try { SEED = JSON.parse($('#seed').textContent); } catch (e) { }
const IDB = {
    open: () => new Promise((res, rej) => { const r = indexedDB.open('hadoo', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
    get: async (k) => { const db = await IDB.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
    set: async (k, v) => { const db = await IDB.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};
const S = { view: 'home', pid: null, tab: 'products', edit: null, img: 0, admin: false, step: 'cart', disc: null, msg: '', cart: ld('hd_cart', []), orders: ld('hd_orders', []), last: null };
// D = ข้อมูลร้านทั้งหมด: site(ข้อความ) chars(ตัวละคร) products(สินค้า) codes(โค้ดลด) pay(บัญชี/QR) gallery(รูป About)
// S = สถานะชั่วคราว: หน้าที่เปิดอยู่ ตะกร้า ออเดอร์ ฯลฯ
// save() = บันทึก D ลงเบราว์เซอร์ทุกครั้งที่เจ้าของแก้ข้อมูล
const save = () => {
    D.ts = Date.now();
    IDB.set('D', D).catch(() => alert('Could not save. Your browser may be blocking storage (e.g. private mode) or the device is full.'));
};
const sv = (k, v) => { try {
    localStorage.setItem(k, JSON.stringify(v));
}
catch (e) { } };

/* ═══════════════════════════════════════════
   3) ฟังก์ชันช่วยเล็ก ๆ (รูปว่าง, ราคา, สต็อก)
   ═══════════════════════════════════════════ */

const PH = n => 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#eadff3"/><text x="100" y="92" font-size="13" text-anchor="middle" fill="#7a7090" font-family="sans-serif">Image not uploaded</text><text x="100" y="114" font-size="12" text-anchor="middle" fill="#7a7090" font-family="sans-serif">' +
         esc(n) +
         '</text></svg>');
const img = (u, n = 'Placeholder') => u || PH(n);
const chars = () => DEFCH.map((d, i) => ({ ...d, ...(D.chars[i] || {}) }));
const chMain = c => c.img || ((c.gallery || [])[0] || {}).u;
const msg = c => c.message ? '“' + c.message.replace(/[“”]/g, '') + '”' : '';
const tagsHTML = t => (t || '').split(',').map(x => x.trim()).filter(Boolean).map(x => '<span class="tag">' +
         esc(x) +
         '</span>').join(' ');
const designHTML = c => c.design ? '<ul>' +
         c.design.split('\n').filter(x => x.trim()).map(x => '<li>' +
         esc(x) +
         '</li>').join('') +
         '</ul>' : '';
const prev = t => t ? (t.length > 130 ? t.slice(0, 130).trim() +
         '…' : t) : 'Official story coming soon.';
const money = v => '฿' + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hasPrice = p => p.price !== '' && p.price != null && !isNaN(p.price);
const avail = p => hasPrice(p) && (p.preorder || p.stock > 0);
const stock = p => p.preorder ? 'Pre-order' : p.stock === '' || p.stock == null ? 'Stock not set' : p.stock > 0 ? 'In stock (' +
         p.stock +
         ')' : 'Sold out';

/* ═══════════════════════════════════════════
   4) การเปลี่ยนหน้า (router) และการวาดหน้าจอ (render)
   ═══════════════════════════════════════════ */
// go(ชื่อหน้า) = เปลี่ยนหน้า | render() = วาดหน้าใหม่ทุกครั้งที่ข้อมูลเปลี่ยน
function go(v, id) { S.view = v; S.pid = id ?? null; S.img = -1; S.msg = ''; if (v !== 'cart')
    S.step = 'cart'; scrollTo(0, 0); try {
    location.hash = v === 'product' ? 'p-' + id : v === 'char' ? 'c-' + id : v;
}
catch (e) { } render(); }
function route() { const h = location.hash.slice(1); if (h.startsWith('p-')) {
    S.view = 'product';
    S.pid = h.slice(2);
}
else if (h.startsWith('c-')) {
    S.view = 'char';
    S.pid = h.slice(2);
}
else if (h) {
    S.view = h;
} }
addEventListener('hashchange', () => { route(); render(); });
// shrink() ย่อรูปที่อัปโหลดให้เล็กลง (เว็บโหลดเร็ว + ไม่เต็มที่เก็บ) | pick() เปิดหน้าต่างเลือกรูป
async function shrink(f, max = 800) {
    const b = await createImageBitmap(f), k = Math.min(1, max / Math.max(b.width, b.height)), c = document.createElement('canvas');
    c.width = Math.round(b.width * k); c.height = Math.round(b.height * k);
    const x = c.getContext('2d'), png = f.type === 'image/png';
    if (!png) { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
    x.drawImage(b, 0, 0, c.width, c.height);
    if (!png) return c.toDataURL('image/jpeg', .78);
    const w = c.toDataURL('image/webp', .85);          // WebP keeps transparency and is much smaller than PNG
    return w.startsWith('data:image/webp') ? w : c.toDataURL('image/png');
}
function pick(multi, cb, max) { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/png,image/jpeg'; i.multiple = multi; i.onchange = async () => { const u = []; for (const f of i.files)
    u.push(await shrink(f, max)); cb(u); }; i.click(); }
function render() {
    $('#logo').innerHTML = (D.site.logo ? '<img src="' + D.site.logo + '" alt="">' : '') +
             '<b>HADOO</b>';
    const n = S.cart.reduce((a, c) => a + c.q, 0);
    $('#menu').innerHTML = [['home', 'Home'], ['chars', 'Meet the Hadoos'], ['shop', 'Shop'], ['about', 'About']].map(x => '<button class="btn s" onclick="go(\'' +
             x[0] +
             '\')">' +
             x[1] +
             '</button>').join(' ') +
             ' <button class="btn s p" onclick="go(\'cart\')">Cart (' +
             n +
             ')</button>';
    $('#app').innerHTML = ({ home, chars: charsV, char: charProfile, shop, product, cart, about, admin: adminV }[S.view] || home)() +
             footer();
}

/* ═══════════════════════════════════════════
   5) หน้าสำหรับลูกค้า: Home / Characters / Shop / Product
   ═══════════════════════════════════════════ */
// card = กล่องสินค้า 1 ชิ้นที่ใช้ซ้ำในหน้าแรกและหน้า Shop
const card = p => '<div class="card"><img class="m" src="' +
         img((p.images || [])[p.main || 0], p.name) +
         '" alt="' +
         esc(p.name) +
         '" loading="lazy"><b>' +
         esc(p.name) +
         '</b><span class="price">' +
         (hasPrice(p) ? money(p.price) : 'Price not set') +
         '</span><span class="mute">' +
         stock(p) +
         '</span><button class="btn s p" onclick="go(\'product\',\'' +
         p.id +
         '\')">View product</button></div>';
function home() {
    const s = D.site, C = chars(), fi = +(s.featured ?? 1), fc = C[fi] || C[0], f = D.products.filter(p => p.featured), nw = D.products.filter(p => p.isNew), gal = [];
    C.forEach(c => (c.gallery || []).forEach(x => gal.push({ u: x.u, t: c.name + ' — ' +
             x.label })));
    (D.gallery || []).forEach(u => gal.push({ u, t: 'Artwork' }));
    return '<div class="hero">' + (s.banner ? '<div class="note">' + esc(s.banner) +
             '</div>' : '') +
             '<h1>FIVE SEASONS. FIVE LITTLE ALIENS. ENDLESS FUN.</h1><p>' +
             esc(s.intro || DEFINTRO) +
             '</p><img class="grp" src="' +
             img(s.groupImg, 'Group image of all five Hadoos') +
             '" alt="The five Hadoos"><div class="row" style="justify-content:center"><button class="btn p" onclick="go(\'shop\')">SHOP THE COLLECTION</button><button class="btn" onclick="go(\'chars\')">MEET THE HADOOS</button></div><p style="margin-top:14px"><b>“Make Every Moment a Hadoo Moment!”</b></p></div>'
        + '<div class="wrap"><h2>Meet the Hadoos</h2><div class="grid">' + C.map(chCard).join('') +
                 '</div>'
        + '<h2>Featured character</h2><div class="box two" style="background:' + accent(fi) +
                 ';color:#3b3350"><img style="width:100%;border-radius:20px;aspect-ratio:1;object-fit:contain;background:#fff8" src="' +
                 img(chMain(fc), fc.name) +
                 '" alt=""><div><h3 style="margin-top:0">' +
                 esc(fc.name) +
                 '</h3>' +
                 (fc.tagline ? '<p><b>' +
                 esc(fc.tagline) +
                 '</b></p>' : '') +
                 '<div class="row" style="gap:4px">' +
                 tagsHTML(fc.personality) +
                 '</div><p>' +
                 esc(prev(fc.story)) +
                 '</p><button class="btn p" onclick="go(\'char\',' +
                 fi +
                 ')">DISCOVER ' +
                 esc(fc.name.toUpperCase()) +
                 '</button></div></div>'

// ขั้นตอน: cart (กรอกที่อยู่) -> pay (แสดง QR/บัญชี) -> done (บันทึกออเดอร์)
function addCart(id, buy) { const p = D.products.find(x => x.id === id); let q = Math.max(1, parseInt($('#qty').value) || 1); const e = S.cart.find(c => c.id === id), t = (e ? e.q : 0) +
         q, m = p.preorder ? 99 : p.stock; e ? e.q = Math.min(m, t) : S.cart.push({ id, q: Math.min(m, t) }); sv('hd_cart', S.cart); buy ? go('cart') : (render(), $('#pm').textContent = 'Added to cart!'); }
const lines = () => S.cart.map(c => ({ c, p: D.products.find(p => p.id === c.id) })).filter(x => x.p && hasPrice(x.p));
const shipFee = () => { const v = D.site.ship; return v === '' || v == null || isNaN(v) ? null : +v; };
const shipLine = T => T.ship == null ? '<p class="mute">Shipping fee: to be confirmed by the shop.</p>' : '<p>Shipping: ' +
         money(T.ship) +
         '</p>';
function totals() { const L = lines(), sub = L.reduce((a, x) => a +
         x.c.q * x.p.price, 0), pct = S.disc ? S.disc.pct : 0, ship = shipFee(); return { L, sub, pct, dis: sub * pct / 100, ship, tot: sub * (1 - pct / 100) +
         (ship || 0) }; }
function cart() {
    const T = totals(), L = T.L, P = D.pay;
    if (S.step === 'done') {
        const o = S.last, txt = encodeURIComponent('HaDoo order ' + o.id + '\n' +
                 o.items.map(i => i.name +
                 ' x' +
                 i.q).join('\n') +
                 '\nTotal: ' +
                 money(o.total) +
                 '\nName: ' +
                 o.customer.name +
                 '\nTel: ' +
                 o.customer.phone +
                 '\nAddress: ' +
                 o.customer.addr +
                 ', ' +
                 o.customer.city +
                 ' ' +
                 o.customer.zip +
                 ', ' +
                 o.customer.country);
        return '<div class="wrap"><div class="box"><h2 style="margin-top:0">Order request recorded</h2><p>Order <b>' +
                 esc(o.id) +
                 '</b>. <b>Payment is not verified yet.</b> This website does not process payments itself. The order is confirmed only after the shop checks your transfer. Send your payment slip with the order number to the shop.</p>' +
                 (D.site.email ? '<a class="btn p" href="mailto:' +
                 esc(D.site.email) +
                 '?subject=HaDoo order ' +
                 o.id +
                 '&body=' +
                 txt +
                 '">Email order and slip to shop</a> ' : '') +
                 '<button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(decodeURIComponent(\'' +
                 txt +
                 '\'));this.textContent=\'Copied\'">Copy order details</button> <button class="btn" onclick="go(\'shop\')">Keep shopping</button></div></div>';
    }
    if (!L.length)
        return '<div class="wrap"><h2>Your cart</h2><p class="mute">Your cart is empty.</p><button class="btn p" onclick="go(\'shop\')">Shop the Collection</button></div>';
    const sum = '<p>Subtotal: ' + money(T.sub) + '</p>' + (T.pct ? '<p>Discount (' + T.pct +
             '%): −' +
             money(T.dis) +
             '</p>' : '') +
             shipLine(T) +
             '<p class="price">Total: ' +
             money(T.tot) +
             '</p>';
    if (S.step === 'pay')
        return '<div class="wrap"><h2>Payment</h2><div class="box"><h3 style="margin-top:0">Order summary</h3>' +
                 L.map(x => '<p>' +
                 esc(x.p.name) +
                 (x.p.preorder ? ' (pre-order)' : '') +
                 ' × ' +
                 x.c.q +
                 ' — ' +
                 money(x.p.price * x.c.q) +
                 '</p>').join('') +
                 sum +
                 '</div><div class="box"><h3 style="margin-top:0">Pay by transfer / QR</h3><p>Amount: <b>' +
                 money(T.tot) +
                 '</b></p>' +
                 (P.qr ? '<img class="qr" src="' +
                 P.qr +
                 '" alt="Payment QR">' : '<p class="mute">QR code not uploaded yet.</p>') +
                 (P.bank || P.acct ? '<p>Bank: ' +
                 esc(P.bank) +
                 '<br>Account no.: <b>' +
                 esc(P.acct) +
                 '</b><br>Account name: ' +
                 esc(P.holder) +
                 '</p>' : '<p class="mute">Bank details not added yet.</p>') +
                 '<div class="note">After you transfer, send your payment slip and order number to the shop. Your order is confirmed once the payment has been checked.</div><button class="btn p" onclick="placeOrder()">I’ve paid / confirm order</button> <button class="btn" onclick="S.step=\'cart\';render()">Back</button></div></div>';
    const f = (k, l, t) => '<label>' + l + '</label><input id="f_' + k + '" type="' +
             (t || 'text') +
             '" value="' +
             esc((S.form || {})[k] || '') +
             '">';
    return '<div class="wrap"><h2>Your cart</h2><div class="box tw"><table>' +
             L.map(x => '<tr><td>' +
             esc(x.p.name) +
             '</td><td><input class="q" type="number" min="1" value="' +
             x.c.q +
             '" onchange="setQ(\'' +
             x.p.id +
             '\',this.value)"></td><td>' +
             money(x.p.price * x.c.q) +
             '</td><td><button class="btn s d" onclick="rmCart(\'' +
             x.p.id +
             '\')">Remove</button></td></tr>').join('') +
             '</table></div><div class="box"><div class="row"><input id="code" placeholder="Discount code" style="max-width:200px" value="' +
             esc(S.disc ? S.disc.code : '') +
             '"><button class="btn s" onclick="applyCode()">Apply</button><span class="mute">' +
             esc(S.msg) +
             '</span></div></div><div class="box"><h3 style="margin-top:0">Shipping details</h3>' +
             f('name', 'Full name') +
             f('email', 'Email', 'email') +
             f('phone', 'Phone', 'tel') +
             f('addr', 'Street address') +
             f('city', 'City') +
             f('zip', 'Postal code') +
             f('country', 'Country') +
             '</div><div class="box"><h3 style="margin-top:0">Order summary</h3>' +
             sum +
             '<button class="btn p" onclick="toPay()">Continue to payment</button></div></div>';
}
function setQ(id, v) { const c = S.cart.find(x => x.id === id), p = D.products.find(x => x.id === id); c.q = Math.max(1, Math.min(p.preorder ? 99 : p.stock || 1, parseInt(v) || 1)); sv('hd_cart', S.cart); render(); }
function rmCart(id) { S.cart = S.cart.filter(c => c.id !== id); sv('hd_cart', S.cart); render(); }
function applyCode() { const c = $('#code').value.trim().toUpperCase(), d = D.codes.find(x => x.code === c); S.disc = d || null; S.msg = d ? 'Code applied!' : 'Code not valid.'; render(); }
function toPay() {
    const g = k => $('#f_' + k).value.trim(), cu = {};
    for (const k of ['name', 'email', 'phone', 'addr', 'city', 'zip', 'country'])
        cu[k] = g(k);
    S.form = cu;
    if (!cu.name || !/\S+@\S+/.test(cu.email) || !cu.phone || !cu.addr || !cu.city || !cu.country)
        return alert('Please fill in name, a valid email, phone, address, city and country.');
    S.step = 'pay';
    render();
}
function placeOrder() {
    const T = totals(), o = { id: 'HD' +
             Date.now().toString(36).toUpperCase(), items: T.L.map(x => ({ name: x.p.name, q: x.c.q, price: x.p.price, pre: !!x.p.preorder })), customer: S.form, total: +T.tot.toFixed(2), code: S.disc ? S.disc.code : '', status: 'awaiting payment check', created: Date.now() };
    S.orders.unshift(o);
    sv('hd_orders', S.orders);
    S.last = o;
    S.cart = [];
    sv('hd_cart', []);
    S.step = 'done';
    render();
}

function aExport() { return '<div class="box"><h3 style="margin-top:0">Publish your shop</h3><p>Your edits live only in this browser. To show the shop to others, download a copy with all your text, images and payment details built in, then upload that file to a free host (Netlify Drop, GitHub Pages, Google Sites embed) or send it as a file.</p><button class="btn p" onclick="exportSite()">Download shop file (hadoo.html)</button></div>'; }
async function exportSite() {
    const d = Object.assign({}, D, { ts: Date.now() });
    let h = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    h = h.replace(/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a +
             JSON.stringify(d).replace(/</g, '\\u003c') +
             b);
    const blob = new Blob([h], { type: 'text/html' });
    try {
        const dl = await claude.use('downloads');
        if (dl)
            return dl.save({ filename: 'hadoo.html', data: blob });
    }
    catch (e) { }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'hadoo.html';
    a.click();
}
async function boot() {
    try {
        let lc = await IDB.get('D');
        let migrated = false;
        if (!lc) { lc = ld('hd_data', null); migrated = !!lc; }   // ย้ายข้อมูลเก่าจาก localStorage
        D = Object.assign(D, (SEED && (!lc || SEED.ts >= lc.ts)) ? SEED : lc || {});
        if (migrated) { await IDB.set('D', D); try { localStorage.removeItem('hd_data'); } catch (e) { } }
    }
    catch (e) { if (SEED) D = Object.assign(D, SEED); }
    route();
    render();
}
boot();
